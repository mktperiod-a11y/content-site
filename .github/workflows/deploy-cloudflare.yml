name: Cloudflare 배포

# 지금은 Actions 화면에서 버튼을 눌렀을 때만 배포한다.
# 몇 번 돌려서 안정적인 것이 확인되면 main push 트리거를 추가한다.
on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # 주소는 <WORKER_NAME>.<계정 하위 주소>.workers.dev 가 된다.
  WORKER_NAME: www
  DB_NAME: moviesiso
  WRANGLER_SEND_METRICS: "false"
  CI: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 준비 상태 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 시크릿이 없습니다." >&2
            echo "저장소 Settings > Secrets and variables > Actions 에 등록해주세요." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 데이터베이스 준비 (없으면 만든다)
        run: |
          find_id() {
            npx wrangler d1 list --json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.env.DB_NAME);process.stdout.write(db?db.uuid:"")})'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "D1 '$DB_NAME' 이 없어 새로 만듭니다."
            npx wrangler d1 create "$DB_NAME"
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then
            echo "D1 ID를 확인하지 못했습니다. 토큰에 'D1 Edit' 권한이 있는지 확인해주세요." >&2
            exit 1
          fi
          echo "D1: $DB_NAME ($id)"
          echo "CLOUDFLARE_D1_DATABASE_ID=$id" >> "$GITHUB_ENV"

      - name: 테이블 반영
        run: |
          # 마이그레이션만을 위한 설정을 잠깐 만든다. 적용 이력은 D1 안의
          # d1_migrations 표에 남아, 이미 반영된 파일은 건너뛴다.
          cat > "$RUNNER_TEMP/migrate.json" <<JSON
          {
            "name": "$WORKER_NAME",
            "compatibility_date": "2026-05-15",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "$DB_NAME",
              "database_id": "$CLOUDFLARE_D1_DATABASE_ID",
              "migrations_dir": "$GITHUB_WORKSPACE/drizzle"
            }]
          }
          JSON
          npx wrangler d1 migrations apply "$DB_NAME" --remote --config "$RUNNER_TEMP/migrate.json"

      - name: 빌드
        env:
          CLOUDFLARE_D1_DATABASE_NAME: ${{ env.DB_NAME }}
          CLOUDFLARE_WORKER_NAME: ${{ env.WORKER_NAME }}
        run: npm run build

      - name: 배포
        id: deploy
        run: |
          npx wrangler deploy --config dist/server/wrangler.json | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          if [ -z "$url" ]; then
            echo "배포 주소를 찾지 못했습니다. Workers & Pages 화면에서 workers.dev 하위 주소를 확인해주세요." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: API 키 연결
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # 도메인을 연결하면 저장소 변수(Settings > Variables)에 PUBLIC_SITE_URL 을 넣는다.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || steps.deploy.outputs.url }}
        run: |
          # 키 값이 로그나 명령행에 남지 않도록 권한을 좁힌 임시 파일로 넘기고 바로 지운다.
          umask 077
          file="$RUNNER_TEMP/secrets.json"
          node -e 'const o={};for(const n of ["KOBIS_API_KEY","TMDB_API_KEY","PUBLIC_SITE_URL"]){if(process.env[n])o[n]=process.env[n]}process.stdout.write(JSON.stringify(o))' > "$file"
          npx wrangler secret bulk "$file" --config dist/server/wrangler.json
          rm -f "$file"

      - name: 첫 화면 확인과 데이터 채우기
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # 방금 넣은 키가 새 버전에 반영될 시간을 준다.
          sleep 15
          # 첫 방문자를 기다리지 않고 목록을 채워둔다. 실패해도 매일 03:00(KST) 크론이 다시 시도한다.
          status=$(curl -sS -o "$RUNNER_TEMP/refresh.json" -w "%{http_code}" -X POST --max-time 120 "$URL/api/releases/refresh" || echo "000")
          echo "수집 호출: HTTP $status"
          head -c 800 "$RUNNER_TEMP/refresh.json" || true
          echo
          failed=0
          for path in / /movies/now /search; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$URL$path" || echo "000")
            echo "화면 $path → HTTP $code"
            [ "$code" = "200" ] || failed=1
          done
          {
            echo "### 무비시소 배포"
            echo
            echo "- 주소: $URL"
            echo "- 첫 수집 호출: HTTP $status"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" = "1" ]; then
            echo "화면 하나 이상이 200 을 돌려주지 않았습니다." >&2
            exit 1
          fi
