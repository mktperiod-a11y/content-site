name: 영화 데이터 수집

# 매일 03:37 KST(18:37 UTC). 사이트 자체 크론(03:00)이 극장 목록을 갱신한 뒤에
# 돌아, 새로 올라온 영화의 포스터·매칭까지 채운다.
# GitHub의 예약 실행은 정각에 몰려 밀리므로 분을 일부러 비켜 둔다.
on:
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

# 같은 워크플로가 겹쳐 돌면 서로의 커밋을 덮어쓴다.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      # 운영 사이트의 D1 을 찾아, 수집 전후로 주고받을 설정을 만든다.
      # Cloudflare 시크릿이 없으면 건너뛰고 저장소 기록만 남긴다.
      - name: 운영 D1 연결
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare 시크릿이 없어 D1 반영을 건너뜁니다."
            exit 0
          fi
          id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="moviesiso");process.stdout.write(db?db.uuid:"")})')"
          if [ -z "$id" ]; then
            echo "D1 'moviesiso' 가 없습니다. 먼저 'Cloudflare 배포'를 실행해주세요." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/d1.json" <<JSON
          { "name": "collector", "compatibility_date": "2026-05-15",
            "d1_databases": [{ "binding": "DB", "database_name": "moviesiso", "database_id": "$id" }] }
          JSON
          echo "D1_CONFIG=$RUNNER_TEMP/d1.json" >> "$GITHUB_ENV"

      - name: 영화 정보 수집
        id: collect
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/refresh-data.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 는 "일부만 수집됨"이다. 받아온 만큼은 커밋해야 하므로
          # 여기서 멈추지 않고, 커밋을 마친 뒤 마지막 단계에서 알린다.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: 변경분 커밋
        run: |
          # git diff 는 아직 추적되지 않는 파일을 보지 못한다. catalog.json 이 없던
          # 저장소에서도 커밋되도록 반드시 먼저 add 한 뒤 비교한다.
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): 영화 정보 갱신 ($(date -u '+%Y-%m-%d'))"
          # 수집이 도는 동안 main 이 움직였을 수 있다.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 수집 완결성 확인
        if: steps.collect.outputs.code == '2'
        run: |
          echo "받아온 정보는 커밋했지만 일부 항목을 수집하지 못했습니다."
          echo "어떤 항목인지는 '영화 정보 수집' 단계의 마지막 줄에 있습니다."
          exit 1
