name: 주간 영화 데이터 갱신

# 매주 월요일 03:17 KST(일요일 18:17 UTC).
# GitHub의 예약 실행은 정각에 몰려 밀리므로 분을 일부러 비켜 둔다.
on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

# 같은 워크플로가 겹쳐 돌면 서로의 커밋을 덮어쓴다.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: 영화 정보 수집
        id: collect
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set +e
          node scripts/refresh-data.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 는 "일부만 수집됨"이다. 받아온 만큼은 커밋해야 하므로
          # 여기서 멈추지 않고, 커밋을 마친 뒤 마지막 단계에서 알린다.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: 변경분 커밋
        run: |
          # data/catalog.json 은 처음에는 추적되지 않는 새 파일이다.
          # git diff 는 그런 파일을 보지 못하므로 반드시 먼저 add 한 뒤 비교한다.
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): 주간 영화 정보 갱신 ($(date -u '+%Y-%m-%d'))"
          # 수집이 도는 동안 main 이 움직였을 수 있다.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 수집 완결성 확인
        if: steps.collect.outputs.code == '2'
        run: |
          echo "받아온 정보는 커밋했지만 일부 항목을 수집하지 못했습니다."
          echo "어떤 항목인지는 '영화 정보 수집' 단계의 마지막 줄에 있습니다."
          exit 1
