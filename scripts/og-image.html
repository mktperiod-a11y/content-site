<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0b1424;color:#fff;
       font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",sans-serif;
       display:flex;flex-direction:column;justify-content:center;padding:0 80px;position:relative;overflow:hidden}
  .glow{position:absolute;width:760px;height:760px;right:-200px;top:-260px;border-radius:50%;
        background:radial-gradient(circle,rgba(255,216,77,.16),transparent 62%)}
  .brandrow{display:flex;align-items:center;gap:16px;margin-bottom:40px;position:relative}
  .mark{width:60px;height:60px;border-radius:16px;background:#ffd84d;display:flex;align-items:center;justify-content:center}
  .mark svg{width:32px;height:32px}
  .brandname{font-size:32px;font-weight:700;letter-spacing:-.5px}
  h1{font-size:78px;line-height:1.12;font-weight:800;letter-spacing:-1px;position:relative}
  h1 .hl{color:#ffd84d}
  p{margin-top:28px;font-size:30px;line-height:1.5;color:rgba(255,255,255,.68);position:relative}
  .bar{position:absolute;left:0;bottom:0;width:100%;height:10px;background:#ffd84d}
</style></head><body>
  <div class="glow"></div>
  <div class="brandrow">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0b1424" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 6 3 11l-.9-2.4c-.3-1 .3-2.1 1.3-2.4l13.2-4c1-.3 2.1.3 2.4 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></div>
    <div class="brandname">어디서 보지?</div>
  </div>
  <h1>이 영화,<br><span class="hl">어디서</span> 볼 수 있나요?</h1>
  <p>극장 상영작부터 국내 OTT 구독·대여·구매까지 한 번에</p>
  <div class="bar"></div>
</body></html>
